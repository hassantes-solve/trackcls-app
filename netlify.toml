[[redirects]]
  from = "/trackcls/*"
  to = "https://graceful-conkies-717ed0.netlify.app/:splat"
  status = 200
  force = true
# TrackCLS is a single self-contained index.html (compiles in the browser).
# No build step — Netlify just serves the file, like a plain static site.
[build]
  command = "echo no build needed"
  publish = "."
