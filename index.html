<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a12"/>
<title>AFRITRACK · TrackCLS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--red:#dc2828;--red2:#b91c1c;--ink:#14141b;--charcoal:#26262f;--bg:#f5f5f7;--card:#fff;--line:#e6e3ec;--text:#14141b;--muted:#6b6b80;--danger:#dc2828;--ok:#16a34a;}
*{box-sizing:border-box;} body{margin:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);}
.center{display:flex;align-items:center;justify-content:center;min-height:60vh;} .muted{color:var(--muted);}
.wm-a{font-weight:800;letter-spacing:1px;color:#fff;} .wm-b{font-weight:800;letter-spacing:1px;color:var(--red);}
.app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--ink);color:#fff;}
.topbar .brand{display:flex;align-items:center;}
.brand-sub{margin-left:10px;padding:2px 9px;background:var(--red);color:#fff;border-radius:6px;font-size:12px;font-weight:700;letter-spacing:.5px;}
.who{display:flex;align-items:center;gap:12px;font-size:14px;} .who-role{opacity:.8;font-size:12px;} .who .link,.link{background:none;border:none;color:#fff;cursor:pointer;text-decoration:underline;font-size:13px;}
.body{display:flex;flex:1;}
.side{width:212px;background:var(--card);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;}
.side .navitem{display:block;width:100%;text-align:left;background:none;border:none;padding:10px 12px;border-radius:8px;color:var(--text);font-size:14px;cursor:pointer;font-family:inherit;}
.side .navitem:hover{background:#f4eef0;} .side .navitem.active{background:var(--red);color:#fff;}
.content{flex:1;padding:22px;max-width:1000px;}
h1{font-size:22px;margin:0 0 4px;} h2{font-size:16px;margin:20px 0 10px;} .sub{color:var(--muted);margin:0 0 18px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;} .stat .n{font-size:26px;font-weight:800;color:var(--ink);} .stat .l{color:var(--muted);font-size:13px;}
label{display:block;font-size:13px;margin:10px 0 4px;color:var(--muted);}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--text);}
.row{display:flex;gap:12px;flex-wrap:wrap;} .row>div{flex:1;min-width:180px;}
button.btn{background:var(--red);color:#fff;border:none;padding:11px 18px;border-radius:9px;font-weight:600;cursor:pointer;font-size:14px;} button.btn:hover{background:var(--red2);} button.btn:disabled{opacity:.5;cursor:not-allowed;}
button.ghost{background:#fff;border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:8px;cursor:pointer;}
table{width:100%;border-collapse:collapse;font-size:14px;} th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);} th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;} .b-active,.b-completed{background:#e3f5ec;color:var(--ok);} .b-suspended,.b-overdue{background:#fdecea;color:var(--danger);} .b-started,.b-in_transit,.b-arrived,.b-pending_input{background:#fff5da;color:#8a6d00;}
.err{color:var(--danger);font-size:14px;margin:8px 0;} .ok{color:var(--ok);font-size:14px;margin:8px 0;}
.video-wrap{position:relative;background:#000;border-radius:10px;overflow:hidden;} video{width:100%;display:block;}
.qr-box{max-width:360px;}
.step{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;} .step .num{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;} .step.done .num{background:var(--ok);}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line);}
.confirm-q{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;} .pill-yes{background:var(--ok);color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;} .pill-no{background:var(--danger);color:#fff;border:none;padding:6px 12px;border-radius:8px;cursor:pointer;}
/* NIGHT-MODE LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 25% 15%,#1a1420 0%,#0a0a12 55%,#06060d 100%);}
.login-panel{display:flex;gap:44px;align-items:center;max-width:960px;width:100%;flex-wrap:wrap;justify-content:center;}
.login-hero{flex:1;min-width:300px;color:#e8e8f0;}
.login-wordmark{font-size:2.6rem;letter-spacing:1px;} 
.login-hero-tag{color:#8a8aa0;font-size:.9rem;letter-spacing:1px;margin-top:6px;margin-bottom:18px;}
.login-truck{width:100%;max-width:440px;display:block;}
.lock-glow{filter:drop-shadow(0 0 7px rgba(220,40,40,.95));animation:lockpulse 2.4s ease-in-out infinite;}
@keyframes lockpulse{0%,100%{filter:drop-shadow(0 0 5px rgba(220,40,40,.7));}50%{filter:drop-shadow(0 0 16px rgba(220,40,40,1)) drop-shadow(0 0 30px rgba(220,40,40,.4));}}
.login-chips{display:flex;gap:10px;margin-top:14px;} .login-chips span{font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:#b91c1c;border:1px solid #2a2a3a;background:#12121c;border-radius:20px;padding:5px 14px;}
.login-card{width:360px;max-width:100%;background:#0e0e18;border:1.5px solid rgba(220,40,40,.5);border-radius:18px;padding:30px 28px;box-shadow:0 24px 70px rgba(220,40,40,.18);color:#e8e8f0;}
.lc-title{font-size:1.2rem;font-weight:700;margin-bottom:2px;}
.login-card .login-sub{color:#8a8aa0;font-size:.86rem;margin:2px 0 14px;}
.login-card label{color:#8a8aa0;} .login-card input{background:#161622;border:1px solid #2a2a3a;color:#fff;}
.login-card input:focus{outline:none;border-color:var(--red);}
.login-btn{width:100%;margin-top:16px;padding:12px;} .login-foot{text-align:center;color:#5a5a72;font-size:.72rem;margin-top:18px;} .login-foot b{color:#dc2828;}
@media(max-width:760px){.login-panel{flex-direction:column;gap:24px;} .login-hero{text-align:center;} .login-truck{margin:0 auto;} .login-chips{justify-content:center;} .side{position:fixed;bottom:0;left:0;right:0;width:100%;flex-direction:row;overflow-x:auto;border-top:1px solid var(--line);z-index:20;} .content{padding-bottom:80px;}}

</style>
</head>
<body>
<div id="root"></div>
