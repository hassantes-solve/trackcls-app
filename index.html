// ===== auth/AuthContext.jsx =====

const AuthContext = createContext(null)
const useAuth = () => useContext(AuthContext)

function AuthProvider({ children }) {
  const [session, setSession] = useState(null)
  const [profile, setProfile] = useState(null) // row from public.users
  const [loading, setLoading] = useState(true)

  async function loadProfile(userId) {
    if (!userId) { setProfile(null); return }
    const { data } = await supabase
      .from('users')
      .select('id, role, customer_id, full_name, email, is_active')
      .eq('id', userId)
      .maybeSingle()
    setProfile(data || null)
  }

  useEffect(() => {
    supabase.auth.getSession().then(async ({ data }) => {
      setSession(data.session)
      await loadProfile(data.session?.user?.id)
      setLoading(false)
    })
    const { data: sub } = supabase.auth.onAuthStateChange(async (_e, s) => {
      setSession(s)
      await loadProfile(s?.user?.id)
    })
    return () => sub.subscription.unsubscribe()
  }, [])

  const value = {
    session,
    user: session?.user ?? null,
    profile,
    role: profile?.role ?? null,
    customerId: profile?.customer_id ?? null,
    loading,
    refreshProfile: () => loadProfile(session?.user?.id),
    signOut: () => supabase.auth.signOut(),
  }
  return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>
}

// ===== lib/evidence.js =====

// Uploads a captured photo to the private evidence bucket and records its metadata row.
async function saveEvidence({ customerId, jobId, phase, subject, capture, operatorName }) {
  const path = `${customerId}/${jobId}/${phase}-${subject}-${Date.now()}.jpg`
  const { error: upErr } = await supabase.storage
    .from('evidence')
    .upload(path, capture.blob, { contentType: 'image/jpeg', upsert: true })
  if (upErr) throw upErr

  const { error: rowErr } = await supabase.from('job_photos').insert({
    job_id: jobId, customer_id: customerId, phase, subject,
    storage_path: path, device_time: capture.deviceTime, lat: capture.lat, lng: capture.lng,
    operator_name: operatorName,
  })
  if (rowErr) throw rowErr
  return path
}

// Finds or creates an asset (truck/trailer/container) for this customer, returns its id.
async function ensureAsset(table, column, value, customerId) {
  if (!value) return null
  const { data: found } = await supabase.from(table).select('id').eq(column, value).eq('customer_id', customerId).maybeSingle()
  if (found) return found.id
  const { data: created, error } = await supabase.from(table).insert({ [column]: value, customer_id: customerId }).select('id').single()
  if (error) throw error
  return created.id
}

// ===== components/CameraCapture.jsx =====

// Captures a photo, burns GPS + timestamp + job info onto the image,
// and returns { blob, dataUrl, lat, lng, deviceTime }.
function CameraCapture({ jobId, operatorName, onCapture, label }) {
  const videoRef = useRef(null)
  const streamRef = useRef(null)
  const [ready, setReady] = useState(false)
  const [err, setErr] = useState('')
  const [coords, setCoords] = useState(null)
  const [shot, setShot] = useState(null)

  useEffect(() => {
    let active = true
    navigator.geolocation?.getCurrentPosition(
      (p) => active && setCoords({ lat: p.coords.latitude, lng: p.coords.longitude }),
      () => active && setCoords(null),
      { enableHighAccuracy: true, timeout: 8000 }
    )
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then((stream) => {
        if (!active) { stream.getTracks().forEach(t => t.stop()); return }
        streamRef.current = stream
        if (videoRef.current) { videoRef.current.srcObject = stream; setReady(true) }
      })
      .catch(() => setErr('Camera unavailable. Allow camera access, or use a device with a camera.'))
    return () => { active = false; streamRef.current?.getTracks().forEach(t => t.stop()) }
  }, [])

  function capture() {
    const v = videoRef.current
    if (!v) return
    const w = v.videoWidth || 720, h = v.videoHeight || 960
    const c = document.createElement('canvas')
    c.width = w; c.height = h
    const ctx = c.getContext('2d')
    ctx.drawImage(v, 0, 0, w, h)

    const now = new Date()
    const lines = [
      `AfriTrack TrackCLS`,
      `${now.toISOString().replace('T', ' ').slice(0, 19)} UTC`,
      coords ? `GPS ${coords.lat.toFixed(6)}, ${coords.lng.toFixed(6)}` : 'GPS unavailable',
      `Job ${jobId ? jobId.slice(0, 8) : '—'}  ·  ${operatorName || ''}`,
    ]
    const pad = Math.round(w * 0.02)
    const fs = Math.max(14, Math.round(w * 0.03))
    ctx.font = `${fs}px monospace`
    const boxH = lines.length * (fs + 6) + pad
    ctx.fillStyle = 'rgba(0,0,0,0.55)'
    ctx.fillRect(0, h - boxH, w, boxH)
    ctx.fillStyle = '#fff'
    lines.forEach((t, i) => ctx.fillText(t, pad, h - boxH + pad + i * (fs + 6) + fs * 0.6))

    c.toBlob((blob) => {
      const dataUrl = c.toDataURL('image/jpeg', 0.85)
      const payload = { blob, dataUrl, lat: coords?.lat ?? null, lng: coords?.lng ?? null, deviceTime: now.toISOString() }
      setShot(dataUrl)
      onCapture?.(payload)
    }, 'image/jpeg', 0.85)
  }

  if (err) return <div className="err">{err}</div>

  return (
    <div>
      {label && <label>{label}</label>}
      {shot ? (
        <div>
          <img src={shot} alt="captured" style={{ width: '100%', borderRadius: 10 }} />
          <button className="ghost" style={{ marginTop: 8 }} onClick={() => setShot(null)}>Retake</button>
        </div>
      ) : (
        <div>
          <div className="video-wrap"><video ref={videoRef} autoPlay playsInline muted /></div>
          <button className="btn" style={{ marginTop: 8 }} disabled={!ready} onClick={capture}>
            {ready ? 'Capture photo' : 'Starting camera…'}
          </button>
          <div className="muted" style={{ fontSize: 12, marginTop: 6 }}>
            {coords ? `GPS locked: ${coords.lat.toFixed(5)}, ${coords.lng.toFixed(5)}` : 'Acquiring GPS…'}
          </div>
        </div>
      )}
    </div>
  )
}

// ===== components/QrScanner.jsx =====

// Scans a QR and returns the decoded text via onResult.
// Includes a manual entry fallback for damaged stickers.
function QrScanner({ onResult }) {
  const elId = useRef('qr-' + Math.random().toString(36).slice(2))
  const scannerRef = useRef(null)
  const [err, setErr] = useState('')
  const [manual, setManual] = useState('')

  useEffect(() => {
    const qr = new Html5Qrcode(elId.current)
    scannerRef.current = qr
    qr.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: 250 },
      (text) => { stop(); onResult?.(text) },
      () => {}
    ).catch(() => setErr('Camera unavailable — use manual entry below.'))
    return () => { stop() }
    // eslint-disable-next-line
  }, [])

  function stop() {
    const qr = scannerRef.current
    if (qr && qr.isScanning) qr.stop().catch(() => {})
  }

  return (
    <div className="qr-box">
      <div id={elId.current} />
      {err && <div className="err">{err}</div>}
      <label>Or enter the lock code manually</label>
      <div className="row">
        <div><input value={manual} onChange={e => setManual(e.target.value)} placeholder="TRACKCLS-LOCK-…" /></div>
        <button className="ghost" onClick={() => manual && onResult?.(manual.trim())}>Use code</button>
      </div>
    </div>
  )
}

      const [{ count: jobs }, { count: activeJobs }, { count: exceptions }, { count: trips }] = await Promise.all([
        supabase.from('jobs').select('*', { count: 'exact', head: true }),
        supabase.from('jobs').select('*', { count: 'exact', head: true }).in('state', active),
        supabase.from('jobs').select('*', { count: 'exact', head: true }).eq('has_exception', true),
        supabase.from('jobs').select('*', { count: 'exact', head: true }).in('state', ['completed', 'billed']),
      ])

      if (role === 'provider_admin') {

    })()

  return (
    <div>

          : (s.wallet && <Stat n={`${Number(s.wallet.balance).toLocaleString()} ${s.wallet.currency}`} l="Wallet balance owed" />)}

    </div>
  )
}
function Stat({ n, l }) {
  return <div className="stat"><div className="n">{n ?? 0}</div><div className="l">{l}</div></div>
}

// ===== pages/Jobs.jsx =====

const STATES = ['all', 'pending_input', 'started', 'in_transit', 'arrived', 'completed', 'billed']

function Jobs() {
  const [jobs, setJobs] = useState([])
  const [filter, setFilter] = useState('all')
  const [detail, setDetail] = useState(null)

  useEffect(() => {
    (async () => {
      let q = supabase.from('jobs')
        .select('id, state, created_at, sealed_at, unsealed_at, has_exception, lock_id, container_id, containers(container_code), locks(label)')
        .order('created_at', { ascending: false }).limit(100)
      if (filter !== 'all') q = q.eq('state', filter)
      const { data } = await q
      setJobs(data || [])
    })()
  }, [filter])

  async function openJob(id) {
    const { data } = await supabase.from('job_photos').select('*').eq('job_id', id).order('created_at')
    const job = jobs.find(j => j.id === id)
    setDetail({ job, photos: data || [] })
  }

  return (
    <div>
      <h1>Jobs &amp; Trips</h1>
      <p className="sub">Every seal-to-unseal journey. A completed job counts as one trip.</p>
      <div className="row" style={{ marginBottom: 12 }}>
        <div style={{ maxWidth: 220 }}>
          <select value={filter} onChange={e => setFilter(e.target.value)}>
            {STATES.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        </div>
      </div>
      <div className="card">
        <table>
          <thead><tr><th>Job</th><th>Lock</th><th>Container</th><th>State</th><th>Sealed</th><th>Unsealed</th><th></th></tr></thead>
          <tbody>
            {jobs.map(j => (
              <tr key={j.id}>
                <td>{j.id.slice(0, 8)}{j.has_exception && <span className="badge b-overdue" style={{ marginLeft: 6 }}>exception</span>}</td>
                <td>{j.locks?.label || j.lock_id?.slice(0, 8)}</td>
                <td>{j.containers?.container_code || '—'}</td>
                <td><span className={`badge b-${j.state}`}>{j.state}</span></td>
                <td>{j.sealed_at?.slice(0, 16).replace('T', ' ') || '—'}</td>
                <td>{j.unsealed_at?.slice(0, 16).replace('T', ' ') || '—'}</td>
                <td><button className="ghost" onClick={() => openJob(j.id)}>View</button></td>
              </tr>
            ))}
            {jobs.length === 0 && <tr><td colSpan="7" className="muted">No jobs match this filter.</td></tr>}
          </tbody>
        </table>
      </div>

      {detail && (
        <div className="card">
          <h2>Job {detail.job.id.slice(0, 8)} — evidence</h2>
          <div className="row">
            {detail.photos.map(p => (
              <div key={p.id} style={{ maxWidth: 160 }}>
                <PhotoThumb path={p.storage_path} />
                <div className="muted" style={{ fontSize: 11 }}>{p.phase}/{p.subject}<br />{p.lat ? `${Number(p.lat).toFixed(4)}, ${Number(p.lng).toFixed(4)}` : 'no GPS'}</div>
              </div>
            ))}
            {detail.photos.length === 0 && <div className="muted">No photos on this job.</div>}
          </div>
          <button className="ghost" style={{ marginTop: 10 }} onClick={() => setDetail(null)}>Close</button>
        </div>
      )}
    </div>
  )
}

function PhotoThumb({ path }) {
  const [url, setUrl] = useState(null)
  useEffect(() => {
    supabase.storage.from('evidence').createSignedUrl(path, 600).then(({ data }) => setUrl(data?.signedUrl))
  }, [path])
  return url ? <img src={url} className="thumb" style={{ width: '100%', height: 120 }} alt="evidence" /> : <div className="thumb" style={{ width: '100%', height: 120 }} />
}

    const { data } = await supabase.from('locks')

      .order('created_at', { ascending: false })
    setLocks(data || [])
  }
  useEffect(() => {
    load()
    supabase.from('customers').select('id, legal_name').then(({ data }) => setCustomers(data || []))
  }, [])

  async function register(e) {
    e.preventDefault(); setErr(''); setBusy(true)
    const rows = Array.from({ length: Number(count) }, (_, i) => ({
      label: Number(count) > 1 ? `${label}-${i + 1}` : label,
      customer_id: customerId || null,
    }))
    const { error } = await supabase.from('locks').insert(rows)
    setBusy(false)
    if (error) setErr(error.message); else { setLabel(''); setCount(1); load() }
  }

  return (
    <div>
      <h1>Locks &amp; QR</h1>
      <p className="sub">Register a physical lock; the system generates the QR you print as a sticker.</p>
      <form onSubmit={register} className="card">
        <div className="row">
          <div><label>Label / prefix</label><input value={label} onChange={e => setLabel(e.target.value)} required placeholder="LOCK-A" /></div>
          <div><label>How many</label><input type="number" min="1" max="50" value={count} onChange={e => setCount(e.target.value)} /></div>
          <div><label>Allocate to (optional)</label>
            <select value={customerId} onChange={e => setCustomerId(e.target.value)}>
              <option value="">— Unallocated —</option>
              {customers.map(c => <option key={c.id} value={c.id}>{c.legal_name}</option>)}
            </select>
          </div>
        </div>
        {err && <div className="err">{err}</div>}
        <button className="btn" disabled={busy}>{busy ? 'Registering…' : 'Register lock(s)'}</button>
      </form>

      <div className="grid">
        {locks.map(l => <LockCard key={l.id} lock={l} />)}
      </div>
    </div>
  )
}

function LockCard({ lock }) {
  const canvasRef = useRef(null)
  useEffect(() => {
    if (canvasRef.current && lock.qr_payload) {
      QRCode.toCanvas(canvasRef.current, lock.qr_payload, { width: 150, margin: 1 })
    }
  }, [lock.qr_payload])

  function printSticker() {
    const url = canvasRef.current.toDataURL()
    const w = window.open('', '_blank')
    w.document.write(`<div style="text-align:center;font-family:sans-serif">
      <h3>AfriTrack TrackCLS</h3><img src="${url}"/><p>${lock.label}</p></div>`)
    w.document.close(); w.print()
  }

  return (
    <div className="stat" style={{ textAlign: 'center' }}>
      <canvas ref={canvasRef} />
      <div style={{ fontWeight: 700 }}>{lock.label}</div>
      <div className="muted" style={{ fontSize: 12 }}>{lock.customers?.legal_name || 'Unallocated'}</div>
      <span className={`badge b-${lock.state === 'available' ? 'active' : lock.state}`}>{lock.state}</span>
      <div><button className="ghost" style={{ marginTop: 8 }} onClick={printSticker}>Print sticker</button></div>
    </div>
  )
}

function Seal() {
  const { customerId, profile } = useAuth()
  const opName = profile?.full_name || profile?.email
  const [step, setStep] = useState(0)
  const [lock, setLock] = useState(null)
  const [jobId, setJobId] = useState(null)
  const [trailer, setTrailer] = useState('')
  const [truck, setTruck] = useState('')
  const [container, setContainer] = useState('')
  const [caps, setCaps] = useState({})
  const [err, setErr] = useState(''); const [busy, setBusy] = useState(false); const [done, setDone] = useState(false)

  if (!customerId) return <div className="card muted">Sealing is done by a customer’s field team. Sign in with an operator account tied to a customer.</div>

  async function onScan(text) {
    setErr('')
    const { data: l, error } = await supabase.from('locks').select('*').eq('qr_payload', text).maybeSingle()
    if (error || !l) { setErr('Lock not found or not allocated to your account.'); return }
    if (l.state === 'sealed') { setErr('This lock is already sealed on another job.'); return }
    const { data: job, error: jErr } = await supabase.from('jobs')
      .insert({ customer_id: customerId, lock_id: l.id, sealed_by: profile.id, state: 'pending_input' })
      .select().single()
    if (jErr) { setErr(jErr.message); return }
    setLock(l); setJobId(job.id); setStep(1)
  }

  async function saveShot(subject, capture) {
    try { await saveEvidence({ customerId, jobId, phase: 'seal', subject, capture, operatorName: opName }) }
    catch (e) { setErr(e.message) }
    setCaps(c => ({ ...c, [subject]: capture }))
  }

  async function submit() {
    setErr(''); setBusy(true)
    try {
      const trailerId = await ensureAsset('trailers', 'plate_number', trailer, customerId)
      const truckId = await ensureAsset('trucks', 'plate_number', truck, customerId)
      const containerId = await ensureAsset('containers', 'container_code', container, customerId)
      const seal = caps.lock
      const { error } = await supabase.from('jobs').update({
        trailer_id: trailerId, truck_id: truckId, container_id: containerId,
        state: 'started', sealed_at: new Date().toISOString(),
        seal_lat: seal?.lat ?? null, seal_lng: seal?.lng ?? null,
      }).eq('id', jobId)
      if (error) throw error
      setDone(true)
    } catch (e) { setErr(e.message) }
    setBusy(false)
  }

  if (done) return (
    <div className="card">
      <h1>Sealed ✓</h1>
      <p className="ok">Job {jobId.slice(0, 8)} is now <b>Started</b> — this timestamp and location are the trip’s official start.</p>
      <button className="btn" onClick={() => window.location.reload()}>Seal another</button>
    </div>
  )

  return (
    <div>
      <h1>Seal a container</h1>
      <p className="sub">Scan the lock, then photograph each item. Every photo is stamped with GPS + time.</p>

      {step === 0 && (
        <div className="card"><h2>1 · Scan the lock QR</h2><QrScanner onResult={onScan} />{err && <div className="err">{err}</div>}</div>
      )}

      {step >= 1 && lock && (
        <>
          <div className="step done"><div className="num">✓</div><div>Lock <b>{lock.label}</b> identified — job opened.</div></div>

          <div className="card"><h2>2 · Photograph the lock</h2>
            <CameraCapture jobId={jobId} operatorName={opName} onCapture={c => saveShot('lock', c)} /></div>

          <div className="card"><h2>3 · Trailer</h2>
            <label>Trailer number</label>
            <input value={trailer} onChange={e => setTrailer(e.target.value)} placeholder="T111 ABC" />
            <CameraCapture jobId={jobId} operatorName={opName} onCapture={c => saveShot('trailer', c)} label="Photograph the trailer" /></div>

          <div className="card"><h2>4 · Truck</h2>
            <label>Truck number</label>
            <input value={truck} onChange={e => setTruck(e.target.value)} placeholder="T222 ABC" />
            <CameraCapture jobId={jobId} operatorName={opName} onCapture={c => saveShot('truck', c)} label="Photograph the truck" /></div>

          <div className="card"><h2>5 · Container</h2>
            <label>Container ID</label>
            <input value={container} onChange={e => setContainer(e.target.value)} placeholder="CMU1234" />
            <CameraCapture jobId={jobId} operatorName={opName} onCapture={c => saveShot('container', c)} label="Photograph the container ID" /></div>

          {err && <div className="err">{err}</div>}
          <button className="btn" disabled={busy || !caps.lock} onClick={submit}>
            {busy ? 'Submitting…' : 'Submit & seal'}
          </button>
        </>
      )}
    </div>
  )
}

function Unseal() {
  const { customerId, profile } = useAuth()
  const opName = profile?.full_name || profile?.email
  const [job, setJob] = useState(null)
  const [checks, setChecks] = useState({})       // { trailer: true/false, ... }
  const [caps, setCaps] = useState({})
  const [err, setErr] = useState(''); const [busy, setBusy] = useState(false); const [done, setDone] = useState(null)

  if (!customerId) return <div className="card muted">Unsealing is done by a customer’s field team. Sign in with an operator account.</div>

  async function onScan(text) {
    setErr('')
    const { data: l } = await supabase.from('locks').select('id').eq('qr_payload', text).maybeSingle()
    if (!l) { setErr('Lock not recognised.'); return }
    const { data: j, error } = await supabase.from('jobs')
      .select('*, trailers(plate_number), trucks(plate_number), containers(container_code)')
      .eq('lock_id', l.id).in('state', ['started', 'in_transit', 'arrived'])
      .order('created_at', { ascending: false }).limit(1).maybeSingle()
    if (error || !j) { setErr('No active sealed job found for this lock.'); return }
    // mark arrived
    await supabase.from('jobs').update({ state: 'arrived' }).eq('id', j.id)
    setJob(j)
  }

  const questions = job ? [
    { key: 'trailer', label: `Is this lock on trailer ${job.trailers?.plate_number || '—'}?` },
    { key: 'truck', label: `Is this lock on truck ${job.trucks?.plate_number || '—'}?` },
    { key: 'container', label: `Is this container ${job.containers?.container_code || '—'}?` },
  ] : []

  async function saveShot(subject, capture) {
    try { await saveEvidence({ customerId, jobId: job.id, phase: 'unseal', subject, capture, operatorName: opName }) }
    catch (e) { setErr(e.message) }
    setCaps(c => ({ ...c, [subject]: capture }))
  }

  async function complete() {
    setErr(''); setBusy(true)
    const mismatch = questions.some(q => checks[q.key] === false)
    const notes = questions.filter(q => checks[q.key] === false).map(q => q.label).join('; ')
    const seal = caps.lock
    try {
      const { error } = await supabase.from('jobs').update({
        state: 'completed', unsealed_by: profile.id, unsealed_at: new Date().toISOString(),
        unseal_lat: seal?.lat ?? null, unseal_lng: seal?.lng ?? null,
        has_exception: mismatch, exception_notes: mismatch ? notes : null,
      }).eq('id', job.id)
      if (error) throw error
      setDone({ mismatch })
    } catch (e) { setErr(e.message) }
    setBusy(false)
  }

  if (done) return (
    <div className="card">
      <h1>Completed ✓</h1>
      <p className="ok">Trip counted and charges raised into the wallet.</p>
      {done.mismatch && <p className="err">A mismatch was recorded as an exception for the control room to review.</p>}
      <button className="btn" onClick={() => window.location.reload()}>Unseal another</button>
    </div>
  )

  return (
    <div>
      <h1>Unseal a container</h1>
      <p className="sub">Scan the lock, confirm what arrived matches what left, photograph, and unseal.</p>

      {!job && <div className="card"><h2>1 · Scan the lock QR</h2><QrScanner onResult={onScan} />{err && <div className="err">{err}</div>}</div>}

      {job && (
        <>
          <div className="step done"><div className="num">✓</div><div>Job {job.id.slice(0, 8)} pulled up — status <b>Arrived</b>.</div></div>

          <div className="card"><h2>2 · Confirmation checks</h2>
            {questions.map(q => (
              <div className="confirm-q" key={q.key}>
                <span>{q.label}</span>
                <span>
                  <button className="pill-yes" style={{ opacity: checks[q.key] === true ? 1 : .5 }}
                    onClick={() => setChecks(c => ({ ...c, [q.key]: true }))}>✓ Match</button>{' '}
                  <button className="pill-no" style={{ opacity: checks[q.key] === false ? 1 : .5 }}
                    onClick={() => setChecks(c => ({ ...c, [q.key]: false }))}>✗ Mismatch</button>
                </span>
              </div>
            ))}
          </div>

          <div className="card"><h2>3 · Re-photograph (proof it arrived intact)</h2>
            <CameraCapture jobId={job.id} operatorName={opName} onCapture={c => saveShot('lock', c)} label="Lock" />
            <CameraCapture jobId={job.id} operatorName={opName} onCapture={c => saveShot('trailer', c)} label="Trailer" />
            <CameraCapture jobId={job.id} operatorName={opName} onCapture={c => saveShot('truck', c)} label="Truck" />
            <CameraCapture jobId={job.id} operatorName={opName} onCapture={c => saveShot('container', c)} label="Container" />
          </div>

          {err && <div className="err">{err}</div>}
          <button className="btn" disabled={busy || !caps.lock} onClick={complete}>
            {busy ? 'Unsealing…' : 'Confirm & unseal'}
          </button>
        </>
      )}
    </div>
  )
}

            <p className="sub">Sign in to your account.</p>
            <label>Email</label>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)} required />
            <label>Password</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} required />
            {err && <div className="err">{err}</div>}
            <button className="btn" style={{ marginTop: 12, width: '100%' }} disabled={busy}>{busy ? 'Signing in…' : 'Sign in'}</button>
          </form>
        )}
      </div>
    </div>
  );
}


// ===== Layout =====
const ROLE_LABEL = { provider_admin:'Provider Admin', customer_admin:'Customer Admin', control_room:'Control Room', operator:'Field Operator' };
function Layout({ children }) {
  const { role, profile, signOut } = useAuth();
  const { route, navigate } = useNav();
  const isProvider = role === 'provider_admin';
  const isAdmin = role === 'provider_admin' || role === 'customer_admin';
  const Item = (page,label)=> <button className={'navitem'+(route.page===page?' active':'')} onClick={()=>navigate(page)}>{label}</button>;
  return (
    <div className="app">
      <header className="topbar">
        <div className="brand"><span className="brand-mark">AfriTrack</span><span className="brand-sub">TrackCLS</span></div>
        <div className="who">
          <span className="who-name">{profile?.full_name || profile?.email}</span>
          <span className="who-role">{ROLE_LABEL[role] || role}</span>
          <button className="link" onClick={()=>signOut()}>Sign out</button>
        </div>
      </header>
      <div className="body">
        <nav className="side">
          {Item('dashboard','Dashboard')}
          {Item('jobs','Jobs & Trips')}
          {Item('seal','Seal a container')}
          {Item('unseal','Unseal a container')}
          {isAdmin && Item('team','Team')}
          {Item('wallet','Wallet & Billing')}
          {isProvider && Item('customers','Customers')}
          {isProvider && Item('locks','Locks & QR')}
        </nav>
        <main className="content">{children}</main>
      </div>
    </div>
  );
}


// ===== Router / Shell =====
const PAGES = { dashboard: Dashboard, jobs: Jobs, seal: Seal, unseal: Unseal, team: TeamUsers, wallet: Wallet, customers: Customers, addCustomer: AddCustomer, locks: Locks };
const ROLE_ACCESS = { team:['provider_admin','customer_admin'], customers:['provider_admin'], addCustomer:['provider_admin'], locks:['provider_admin'] };
function AppRouter(){
  const { role } = useAuth();
  const [route,setRoute]=useState({page:'dashboard'});
  const navigate=(page)=>setRoute({page});
  let page = route.page;
  const allow = ROLE_ACCESS[page];
  if(allow && !allow.includes(role)) page='dashboard';
  const Page = PAGES[page] || Dashboard;
  return <NavContext.Provider value={{ route:{page}, navigate }}><Layout><Page/></Layout></NavContext.Provider>;
}
function Shell(){
  const { session, loading } = useAuth();
  const isRecovery = window.location.hash.includes('type=invite') || window.location.hash.includes('type=recovery');
  if(loading) return <div className="center muted">Loading…</div>;
  if(!session || isRecovery) return <Login/>;
  return <AppRouter/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<AuthProvider><Shell/></AuthProvider>);

</script>
</body>
</html>
